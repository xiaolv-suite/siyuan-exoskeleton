<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581C87"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#581C87" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 1. Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.75"/>
  
  <!-- 2. Ambient Internal Neon Glow -->
  <circle cx="64" cy="64" r="34" fill="#A855F7" opacity="0.3" filter="url(#glow)"/>

  <!-- 3. Center Semantic Glyph -->
  <circle cx="44" cy="50" r="10" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
            <circle cx="84" cy="50" r="10" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
            <circle cx="64" cy="84" r="10" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
            <line x1="53" y1="50" x2="75" y2="50" stroke="#C084FC" stroke-width="4"/>
            <line x1="49" y1="58" x2="59" y2="76" stroke="#C084FC" stroke-width="4"/>
            <line x1="79" y1="58" x2="69" y2="76" stroke="#C084FC" stroke-width="4"/>

  <!-- 4. Tier Micro Identifier Dots -->
  <circle cx="64" cy="112" r="2" fill="#C084FC" opacity="0.85"/>
  <circle cx="56" cy="112" r="1.5" fill="#C084FC" opacity="0.45"/>
  <circle cx="72" cy="112" r="1.5" fill="#C084FC" opacity="0.45"/>
</svg>
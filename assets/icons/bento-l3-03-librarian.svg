<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 1. Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.75"/>
  
  <!-- 2. Ambient Internal Neon Glow -->
  <circle cx="64" cy="64" r="34" fill="#F59E0B" opacity="0.3" filter="url(#glow)"/>

  <!-- 3. Center Semantic Glyph -->
  <path d="M44 56 C44 44 60 44 64 54 C68 44 84 44 84 56 C84 72 64 86 64 86 C64 86 44 72 44 56 Z" fill="none" stroke="#EF4444" stroke-width="5" filter="url(#glow)"/>
            <path d="M48 64 L56 64 L60 56 L68 74 L72 64 L80 64" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. Tier Micro Identifier Dots -->
  <circle cx="64" cy="112" r="2" fill="#FBBF24" opacity="0.85"/>
  <circle cx="56" cy="112" r="1.5" fill="#FBBF24" opacity="0.45"/>
  <circle cx="72" cy="112" r="1.5" fill="#FBBF24" opacity="0.45"/>
</svg>
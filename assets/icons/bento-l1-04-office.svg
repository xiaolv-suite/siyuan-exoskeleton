<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 1. Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.75"/>
  
  <!-- 2. Ambient Internal Neon Glow -->
  <circle cx="64" cy="64" r="34" fill="#10B981" opacity="0.3" filter="url(#glow)"/>

  <!-- 3. Center Semantic Glyph -->
  <rect x="38" y="40" width="52" height="48" rx="5" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
            <line x1="38" y1="56" x2="90" y2="56" stroke="#34D399" stroke-width="3.5"/>
            <line x1="38" y1="72" x2="90" y2="72" stroke="#34D399" stroke-width="3.5"/>
            <line x1="64" y1="40" x2="64" y2="88" stroke="#34D399" stroke-width="3.5"/>

  <!-- 4. Tier Micro Identifier Dots -->
  <circle cx="64" cy="112" r="2" fill="#34D399" opacity="0.85"/>
  <circle cx="56" cy="112" r="1.5" fill="#34D399" opacity="0.45"/>
  <circle cx="72" cy="112" r="1.5" fill="#34D399" opacity="0.45"/>
</svg>
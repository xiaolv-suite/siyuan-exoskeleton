<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="exoPenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="stylusBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="35%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="exoGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="nibGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="penGlowFlt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas with Precision Rim -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#exoPenBg)"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>

  <!-- Atmosphere Glow -->
  <circle cx="64" cy="64" r="36" fill="#10B981" opacity="0.18" filter="url(#penGlowFlt)"/>

  <!-- Stylus Shadow -->
  <path d="M42 98 L92 48 L98 54 L48 104 Z" fill="#020617" opacity="0.4" filter="url(#penGlowFlt)"/>

  <!-- Main Exoskeleton Stylus Body (45-degree angle) -->
  <!-- Top Eraser / Finial Cap -->
  <path d="M92 26 L102 36 L96 42 L86 32 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <circle cx="97" cy="31" r="2.5" fill="#10B981"/>

  <!-- Upper Barrel Section -->
  <path d="M84 34 L94 44 L76 62 L66 52 Z" fill="url(#stylusBody)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>

  <!-- Exoskeleton Armored Grip Sleeve (外骨骼动力防滑握槽) -->
  <path d="M64 54 L74 64 L54 84 L44 74 Z" fill="url(#exoGrip)" stroke="#6EE7B7" stroke-width="1.5"/>
  <line x1="61" y1="61" x2="57" y2="65" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="57" y1="65" x2="53" y2="69" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="53" y1="69" x2="49" y2="73" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Lower Nib Cone -->
  <path d="M42 76 L52 86 L36 98 L30 92 Z" fill="url(#stylusBody)" stroke="#94A3B8" stroke-width="1"/>

  <!-- Kinetic Emerald Nib Tip (发光能量笔尖) -->
  <path d="M30 92 L36 98 L24 104 Z" fill="url(#nibGlow)" filter="url(#penGlowFlt)"/>
  <circle cx="24" cy="104" r="3" fill="#FFFFFF"/>

  <!-- Light Beam Spark from Tip -->
  <line x1="24" y1="104" x2="16" y2="112" stroke="#6EE7B7" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="16" cy="112" r="1.5" fill="#FFFFFF"/>
</svg>

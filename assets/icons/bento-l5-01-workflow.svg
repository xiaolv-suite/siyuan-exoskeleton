<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#FB7185" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#881337" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 1. Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.75"/>
  
  <!-- 2. Ambient Internal Neon Glow -->
  <circle cx="64" cy="64" r="34" fill="#F43F5E" opacity="0.3" filter="url(#glow)"/>

  <!-- 3. Center Semantic Glyph -->
  <rect x="38" y="38" width="16" height="16" rx="4" fill="#FFFFFF"/>
            <rect x="74" y="38" width="16" height="16" rx="4" fill="#FFFFFF"/>
            <rect x="56" y="74" width="16" height="16" rx="4" fill="#FB7185" filter="url(#glow)"/>
            <path d="M46 54 L46 64 L56 74 M82 54 L82 64 L72 74" fill="none" stroke="#FB7185" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 4. Tier Micro Identifier Dots -->
  <circle cx="64" cy="112" r="2" fill="#FB7185" opacity="0.85"/>
  <circle cx="56" cy="112" r="1.5" fill="#FB7185" opacity="0.45"/>
  <circle cx="72" cy="112" r="1.5" fill="#FB7185" opacity="0.45"/>
</svg>
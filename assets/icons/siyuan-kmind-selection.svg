<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Base Plugin Icon (Centered with slight inset for breathing room) -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#0F172A"/>
  <image href="data:image/png;base64," x="8" y="8" width="112" height="112" preserveAspectRatio="xMidYMid meet" clip-path="inset(0 round 22px)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- High-Tactile Action Modifier Badge on Bottom Right -->
  <g filter="url(#badgeGlow)">
    <circle cx="94" cy="94" r="23" fill="#7C3AED" stroke="#C084FC" stroke-width="2.5"/>
    <circle cx="94" cy="94" r="19" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="94" y="101" font-size="19" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-weight="900" fill="#FFFFFF">✂️</text>
  </g>
</svg>
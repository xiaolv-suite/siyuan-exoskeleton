<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#312E81" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 1. Squircle Canvas -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="url(#rim)" stroke-width="1.75"/>
  
  <!-- 2. Ambient Internal Neon Glow -->
  <circle cx="64" cy="64" r="34" fill="#6366F1" opacity="0.3" filter="url(#glow)"/>

  <!-- 3. Center Semantic Glyph -->
  <path d="M64 36 L86 46 C86 70 76 86 64 94 C52 86 42 70 42 46 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
            <polygon points="64,48 70,60 84,62 74,72 76,86 64,80 52,86 54,72 44,62 58,60" fill="#34D399" filter="url(#glow)"/>

  <!-- 4. Tier Micro Identifier Dots -->
  <circle cx="64" cy="112" r="2" fill="#818CF8" opacity="0.85"/>
  <circle cx="56" cy="112" r="1.5" fill="#818CF8" opacity="0.45"/>
  <circle cx="72" cy="112" r="1.5" fill="#818CF8" opacity="0.45"/>
</svg>